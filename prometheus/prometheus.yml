global:
  scrape_interval: 120s
  evaluation_interval: 120s

  external_labels:
    monitor: 'lab4-monitoring'

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 60s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    scrape_interval: 60s
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    scrape_interval: 60s
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'jenkins'
    scrape_interval: 60s
    metrics_path: '/prometheus/'
    static_configs:
      - targets: ['jenkins:8080']
