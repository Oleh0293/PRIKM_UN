<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIKM Lab 1 — CI/CD Pipeline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 56px;
            max-width: 640px;
            width: 90%;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .icon-row svg {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 12px rgba(100, 180, 255, 0.4));
        }

        .arrow {
            font-size: 28px;
            color: #64b5f6;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #64b5f6, #ce93d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #aaa;
            margin-bottom: 32px;
        }

        .pipeline {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .stage {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            animation: stageIn 0.6s ease-out both;
        }

        .stage:nth-child(1) { animation-delay: 0.3s; background: rgba(76, 175, 80, 0.2); color: #81c784; border: 1px solid rgba(76, 175, 80, 0.3); }
        .stage:nth-child(2) { animation-delay: 0.5s; background: rgba(33, 150, 243, 0.2); color: #64b5f6; border: 1px solid rgba(33, 150, 243, 0.3); }
        .stage:nth-child(3) { animation-delay: 0.7s; background: rgba(255, 152, 0, 0.2); color: #ffb74d; border: 1px solid rgba(255, 152, 0, 0.3); }
        .stage:nth-child(4) { animation-delay: 0.9s; background: rgba(156, 39, 176, 0.2); color: #ce93d8; border: 1px solid rgba(156, 39, 176, 0.3); }
        .stage:nth-child(5) { animation-delay: 1.1s; background: rgba(0, 188, 212, 0.2); color: #4dd0e1; border: 1px solid rgba(0, 188, 212, 0.3); }

        .stage-arrow {
            color: #555;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            animation: stageIn 0.6s ease-out both;
        }
        .stage-arrow:nth-of-type(2) { animation-delay: 0.4s; }
        .stage-arrow:nth-of-type(4) { animation-delay: 0.6s; }
        .stage-arrow:nth-of-type(6) { animation-delay: 0.8s; }
        .stage-arrow:nth-of-type(8) { animation-delay: 1.0s; }

        @keyframes stageIn {
            from { opacity: 0; transform: scale(0.8); }
            to   { opacity: 1; transform: scale(1); }
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 32px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px;
        }

        .info-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ccc;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 999px;
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: #81c784;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }

        .footer {
            margin-top: 28px;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <div class="card">
        <div class="icon-row">
            <!-- Jenkins icon -->
            <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                <circle cx="128" cy="128" r="120" fill="#335061"/>
                <circle cx="128" cy="100" r="50" fill="#d4a373"/>
                <circle cx="110" cy="90" r="7" fill="#222"/>
                <circle cx="146" cy="90" r="7" fill="#222"/>
                <path d="M112 115 Q128 130 144 115" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
                <rect x="108" y="60" width="40" height="12" rx="6" fill="#222"/>
            </svg>
            <span class="arrow">&#10145;</span>
            <!-- Docker icon -->
            <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                <rect width="256" height="256" rx="40" fill="#2496ed"/>
                <g fill="#fff">
                    <rect x="40" y="100" width="30" height="28" rx="3"/>
                    <rect x="78" y="100" width="30" height="28" rx="3"/>
                    <rect x="116" y="100" width="30" height="28" rx="3"/>
                    <rect x="78" y="66" width="30" height="28" rx="3"/>
                    <rect x="116" y="66" width="30" height="28" rx="3"/>
                    <rect x="154" y="100" width="30" height="28" rx="3"/>
                    <rect x="116" y="32" width="30" height="28" rx="3"/>
                </g>
                <path d="M192 118 C210 108 230 110 240 118" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
                <ellipse cx="188" cy="150" rx="80" ry="36" fill="none" stroke="#fff" stroke-width="5"/>
            </svg>
            <span class="arrow">&#10145;</span>
            <!-- Nginx icon -->
            <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
                <rect width="256" height="256" rx="40" fill="#009639"/>
                <text x="128" y="155" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="90" font-weight="900" fill="#fff">N</text>
            </svg>
        </div>

        <h1>CI/CD Pipeline — Lab 1</h1>
        <p class="subtitle">Automated build &amp; deploy via Jenkins + Docker</p>

        <div class="pipeline">
            <span class="stage">Checkout</span>
            <span class="stage-arrow">&#9654;</span>
            <span class="stage">Build</span>
            <span class="stage-arrow">&#9654;</span>
            <span class="stage">Test</span>
            <span class="stage-arrow">&#9654;</span>
            <span class="stage">Deploy</span>
            <span class="stage-arrow">&#9654;</span>
            <span class="stage">Verify</span>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Image</div>
                <div class="info-value">nginx/custom:latest</div>
            </div>
            <div class="info-item">
                <div class="info-label">Port</div>
                <div class="info-value">80 &#8594; 80</div>
            </div>
            <div class="info-item">
                <div class="info-label">Branch</div>
                <div class="info-value">Lab_1</div>
            </div>
            <div class="info-item">
                <div class="info-label">Author</div>
                <div class="info-value">Oleh</div>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Deployed successfully
        </div>

        <div class="footer">PRIKM &bull; Lab 1 &bull; Jenkins &times; Docker &times; Nginx</div>
    </div>
</body>
</html>
