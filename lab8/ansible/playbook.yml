- name: Deploy Monitoring Stack (Monitor Node)
  hosts: all
  gather_facts: false
  tasks:
    - name: Render Prometheus configuration from template
      template:
        src: templates/prometheus.yml.j2
        dest: /tmp/lab8-prometheus.yml

    - name: Pull Prometheus image
      community.docker.docker_image:
        name: prom/prometheus:latest
        source: pull

    - name: Deploy Prometheus container
      community.docker.docker_container:
        name: lab8-prometheus
        image: prom/prometheus:latest
        state: started
        restart_policy: unless-stopped
        networks:
          - name: lab8-network
        ports:
          - "9092:9090"
        volumes:
          - /tmp/lab8-prometheus.yml:/etc/prometheus/prometheus.yml:ro

    - name: Pull Grafana image
      community.docker.docker_image:
        name: grafana/grafana:latest
        source: pull

    - name: Deploy Grafana container
      community.docker.docker_container:
        name: lab8-grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: unless-stopped
        networks:
          - name: lab8-network
        ports:
          - "3001:3000"
        env:
          GF_SECURITY_ADMIN_USER: "admin"
          GF_SECURITY_ADMIN_PASSWORD: "admin123"

    - name: Wait for Prometheus to be ready
      uri:
        url: "http://localhost:9092/-/ready"
        status_code: 200
      register: prom_result
      retries: 5
      delay: 3
      until: prom_result.status == 200

    - name: Wait for Grafana to be ready
      uri:
        url: "http://localhost:3001/api/health"
        status_code: 200
      register: grafana_result
      retries: 5
      delay: 3
      until: grafana_result.status == 200
